<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d0c">
  <title>WEB.Lab-Stand V3</title>
</head>
<body>
  <p>V3 측정 화면을 불러오는 중입니다.</p>
  <script>
    fetch('../index.html').then(response=>{
      if(!response.ok)throw new Error('load failed');
      return response.text();
    }).then(html=>{
      const versioned=html.replace('<head>','<head><base href="../">');
      document.open();document.write(versioned);document.close();
    }).catch(()=>{document.body.innerHTML='<p>측정 화면을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>';});
  </script>
</body>
</html>
